aid: resolve-ai
name: Resolve AI
description: 'Resolve AI builds AI agents (an "AI SRE") that run production software
  for enterprise engineering teams. Its agents automatically triage and investigate
  alerts, perform root-cause analysis, and troubleshoot incidents within minutes,
  handling on-call rotations, incident response, and scheduled operational tasks so
  engineers can focus on building. The platform connects read-only to a team''s observability
  stack (logs, metrics, traces, dashboards), code repositories, and infrastructure,
  and lets teams embed tribal knowledge and build custom agents via MCP, APIs, and
  a Skills framework. It ships a secure gateway (the Resolve satellite), SAML SSO,
  RBAC, and enterprise controls, and is used by teams at Coinbase, DoorDash, Expedia,
  Snowflake, and MongoDB. Backed by Greylock and Lightspeed Venture Partners.'
